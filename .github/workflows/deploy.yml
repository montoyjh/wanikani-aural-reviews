name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production (main)
        run: |
          VITE_BASE_PATH=/wanikani-aural-reviews/ npm run build
          mkdir -p deploy
          cp -r dist/* deploy/

      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          clean: false

      - name: Install dependencies for staging
        run: npm ci

      - name: Build staging
        run: |
          VITE_BASE_PATH=/wanikani-aural-reviews/staging/ npm run build
          mkdir -p deploy/staging
          cp -r dist/* deploy/staging/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
